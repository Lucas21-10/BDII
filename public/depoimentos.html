<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depoimentos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400..900&family=Poppins:wght@100..900&family=Roboto:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/header&footer.css">
    <link rel="stylesheet" href="./css/styles-depoimentos.css">
</head>

<body>

<!-- 🔥 HEADER IGUAL AO CONTATOS -->
<header>
    <img class="logo-flavio" src="./img/logo-flavio.png" alt="Logo do site">

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="quem-somos.html">Quem somos</a></li>
            <li><a href="produtos.html">Produtos</a></li>
            <li><a href="depoimentos.html">Depoimentos</a></li>
            <li><a href="contatos.html">Contatos</a></li>
        </ul>
    </nav>
</header>

<main class="main-content-wrapper">

<!-- LISTA DE DEPOIMENTOS -->
<section class="depoimentos-sec">
    <div id="lista-depoimentos" class="conteiner-dep"></div>
</section>

<!-- FORMULÁRIO -->
<section class="formulario-comentario">

    <input id="nome" placeholder="Seu nome">
    <textarea id="mensagem" placeholder="Seu comentário"></textarea>

    <button id="btn-enviar">Enviar</button>
</section>

</main>

<!-- 🔥 MODAL MODERNO -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h3>Excluir depoimento?</h3>
    <p>Essa ação não pode ser desfeita.</p>

    <div class="modal-actions">
      <button id="cancelar">Cancelar</button>
      <button id="confirmar">Excluir</button>
    </div>
  </div>
</div>

<script>

const container = document.getElementById("lista-depoimentos");

let idParaDeletar = null;

const modal = document.getElementById("modal");
const btnCancelar = document.getElementById("cancelar");
const btnConfirmar = document.getElementById("confirmar");

/* ABRIR MODAL */
function abrirModal(id, card){
    idParaDeletar = id;
    modal.classList.remove("hidden");

    btnConfirmar.onclick = async () => {
        try {
            const res = await fetch(`/depoimentos/${idParaDeletar}`, {
                method: "DELETE"
            });

            if (!res.ok) throw new Error("Erro ao deletar");

            card.remove();
            modal.classList.add("hidden");

        } catch (err) {
            console.error(err);
            alert("Erro ao deletar depoimento");
        }
    };
}

/* FECHAR MODAL */
btnCancelar.addEventListener("click", () => {
    modal.classList.add("hidden");
    idParaDeletar = null;
});

/* CARREGAR */
async function carregar() {

    const res = await fetch("/depoimentos");
    const dados = await res.json();

    container.innerHTML = "";

    dados.forEach(dep => {

        const card = document.createElement("div");
        card.classList.add("card-dep");

        const msg = document.createElement("blockquote");
        msg.textContent = `"${dep.mensagem}"`;

        const nome = document.createElement("p");
        nome.textContent = `— ${dep.nome}`;

        const btn = document.createElement("button");
        btn.classList.add("btn-lixeira");

        btn.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M3 6h18" stroke="currentColor" stroke-width="2"/>
          <path d="M8 6V4h8v2" stroke="currentColor" stroke-width="2"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" stroke="currentColor" stroke-width="2"/>
        </svg>
        `;

        btn.addEventListener("click", () => {
            abrirModal(dep._id, card);
        });

        card.appendChild(msg);
        card.appendChild(nome);
        card.appendChild(btn);

        container.appendChild(card);
    });
}

/* ENVIAR */
document.getElementById("btn-enviar").addEventListener("click", async () => {

    const nome = document.getElementById("nome").value;
    const mensagem = document.getElementById("mensagem").value;

    if (!nome || !mensagem) return alert("Preencha tudo");

    await fetch("/depoimentos", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ nome, mensagem })
    });

    document.getElementById("nome").value = "";
    document.getElementById("mensagem").value = "";

    carregar();
});

carregar();

</script>

</body>
</html>
